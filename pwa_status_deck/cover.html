<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@400&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E0F2FE;
            position: relative;
            font-family: 'Inter', sans-serif;
            color: #2D3748;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }
        
        .top-rule {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #B91C1C;
        }
        
        .content-wrapper {
            padding: 80px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            align-items: end;
            gap: 40px;
        }
        
        .title-block {
            border-left: 8px solid #0A3622;
            padding-left: 40px;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 80px;
            line-height: 1.1;
            color: #0A3622;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        
        .subtitle {
            font-size: 24px;
            color: #2D3748;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        
        .meta {
            font-size: 18px;
            color: #2D3748;
            opacity: 0.8;
        }
        
        .accent-box {
            height: 300px;
            background-color: #0A3622;
            opacity: 0.05;
            position: absolute;
            right: 0;
            bottom: 0;
            width: 33%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="top-rule"></div>
        <div class="accent-box"></div>
        <div class="content-wrapper">
            <div class="title-block">
                <p class="subtitle">VERIFICATION & DEPLOYMENT STATUS</p>
                <h1>Smart Manager<br>PWA Offline<br>Fallback</h1>
                <p class="meta">As of 26 August 2026 · Prepared by Manus AI</p>
            </div>
        </div>
    </div>
</body>
</html>
