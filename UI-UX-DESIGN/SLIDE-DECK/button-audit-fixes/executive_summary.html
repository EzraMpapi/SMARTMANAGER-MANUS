<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 120px;
            padding-right: 120px;
            overflow: hidden;
        }
        .accent-shape {
            position: absolute;
            top: -150px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }
        .content-wrapper {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }
        .eyebrow {
            font-size: 20px;
            font-weight: 600;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }
        .main-title {
            font-size: 64px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 32px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 28px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 60px;
            max-width: 800px;
        }
        .stats-row {
            display: flex;
            gap: 40px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px 32px;
            min-width: 200px;
        }
        .stat-value {
            font-size: 42px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 16px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            left: 120px;
            font-size: 16px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-shape"></div>
        <div class="content-wrapper">
            <div class="eyebrow">Deployment Report</div>
            <h1 class="main-title">SMART MANAGER: Workflow Integration & Button Audit</h1>
            <p class="subtitle">Comprehensive validation of 3,345 controls, implementation of major workflow repairs, and zero-DDL live schema reconciliation.</p>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value">3,345</div>
                    <div class="stat-label">Controls Audited</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">5</div>
                    <div class="stat-label">Major Workflows Repaired</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">0</div>
                    <div class="stat-label">DDL Statements Applied</div>
                </div>
            </div>
        </div>
        <div class="footer">August 24, 2026</div>
    </div>
</body>
</html>
