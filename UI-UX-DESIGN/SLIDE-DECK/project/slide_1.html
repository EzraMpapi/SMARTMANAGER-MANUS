<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMART MANAGER — Complete UI/UX Design System & Application Blueprint</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F1F5F9;
            font-family: 'Inter', sans-serif;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        .left-pane {
            width: 55%;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 64px;
            z-index: 2;
        }
        
        .content-card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 56px 48px;
            box-shadow: 0 20px 40px rgba(11, 17, 32, 0.08);
            position: relative;
            width: 100%;
        }
        
        .accent-rule {
            position: absolute;
            left: 0;
            top: 48px;
            bottom: 48px;
            width: 6px;
            background-color: #008A45;
            border-radius: 0 4px 4px 0;
        }
        
        h1 {
            color: #008A45;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        
        h2 {
            color: #0B1120;
            font-weight: 900;
            font-size: 56px;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
        }
        
        p {
            color: #334155;
            font-weight: 500;
            font-size: 20px;
            line-height: 1.5;
        }
        
        .right-pane {
            position: absolute;
            right: -64px;
            top: -64px;
            width: 55%;
            height: calc(100% + 128px);
            z-index: 1;
            transform: rotate(-4deg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: -20px 0 60px rgba(11, 17, 32, 0.15);
        }
        
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: left top;
            transform: rotate(4deg) scale(1.1);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-pane">
            <div class="content-card">
                <div class="accent-rule"></div>
                <h1>SMART MANAGER</h1>
                <h2>Complete UI/UX Design System & Application Blueprint</h2>
                <p>Source-grounded product design summary<br>August 2026</p>
            </div>
        </div>
        <div class="right-pane">
            <img class="hero-image" src="/home/ubuntu/SMARTMANAGER-MANUS/UI-UX-DESIGN/05-Visual-Assets/00-style-reference-executive-dashboard.png" alt="Executive Dashboard UI">
        </div>
    </div>
</body>
</html>
