name: Android TWA Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semantic Android version, for example 2.0.0"
        required: false
        default: "2.0.0"
      version_code:
        description: "Positive Android version code"
        required: false
        default: "2"
      publish_release:
        description: "Publish a GitHub release after a signed build"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_DIR: android
  BUBBLEWRAP_VERSION: 1.23.0

jobs:
  quality:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run test suite
        run: pnpm test

  android:
    name: Build signed Android artifacts
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required signing secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_B64" ] || missing+=(ANDROID_KEYSTORE_B64)
          [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || missing+=(BUBBLEWRAP_KEYSTORE_PASSWORD)
          [ -n "$BUBBLEWRAP_KEY_PASSWORD" ] || missing+=(BUBBLEWRAP_KEY_PASSWORD)
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing Android signing secrets: ${missing[*]}"
            echo "Configure organization-controlled signing secrets before publishing a production APK/AAB."
            exit 1
          fi

      - name: Prepare version and signing files
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.0.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="${GITHUB_RUN_NUMBER}"; fi
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "version_code must be numeric"; exit 1;; esac
          [ "$VERSION_CODE" -gt 0 ] || { echo "version_code must be positive"; exit 1; }
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/smart-manager-signing"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/smart-manager-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/smart-manager-signing/release.keystore"
          cat > "$ANDROID_DIR/local.properties" <<EOF
          sdk.dir=$ANDROID_HOME
          EOF
          cat > "$ANDROID_DIR/keystore.properties" <<EOF
          releaseStoreFile=$RUNNER_TEMP/smart-manager-signing/release.keystore
          releaseStorePassword=$BUBBLEWRAP_KEYSTORE_PASSWORD
          releaseKeyAlias=$ANDROID_KEY_ALIAS
          releaseKeyPassword=$BUBBLEWRAP_KEY_PASSWORD
          EOF

      - name: Build release APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android clean assembleRelease bundleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -PreleaseStoreFile="$RUNNER_TEMP/smart-manager-signing/release.keystore" \
            -PreleaseStorePassword="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PreleaseKeyPassword="$BUBBLEWRAP_KEY_PASSWORD"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/smart-manager-${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/smart-manager-${VERSION_NAME}.aab"
          sha256sum artifacts/* | tee artifacts/SHA256SUMS

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-manager-android-${{ env.VERSION_NAME }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub release when requested
        if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: SMART MANAGER Android ${{ env.VERSION_NAME }}
          body: |
            Signed SMART MANAGER Android TWA release.

            Package: `tz.smartmanager.erp`
            Version: `${{ env.VERSION_NAME }}` (`${{ env.VERSION_CODE }}`)
            Production origin: `https://bserp-dashbo-xgm6fauw.manus.space`

            Before Google Play production rollout, verify the release certificate fingerprint is published at `/.well-known/assetlinks.json`.
          files: artifacts/*
