name: Feature Branch CI

on:
  push:
    branches:
      - auth-provider-preview-e2e
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, focused tests, and Vercel-compatible build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Trial notice and auth contract tests
        run: pnpm exec vitest run server/trialExpiryNotice.test.ts server/trialExpiryNoticeAdmin.integration.test.ts server/employeeSelfServiceWorkflowContracts.test.ts server/authContextSnapshotContract.test.ts server/authStateMachine.test.ts

      - name: Full unit test suite
        run: pnpm test

      - name: Vercel-compatible production build
        env:
          VERCEL: "1"
        run: pnpm build

  migration-preflight:
    name: Read-only migration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration files without applying DDL
        env:
          APPLY_MIGRATIONS: "false"
        run: pnpm exec tsx server/runMigrations.mjs --verify
