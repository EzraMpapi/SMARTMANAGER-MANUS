name: CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Unit, Schema, Type and Production Build
    runs-on: ubuntu-latest
    environment: Production – smatimeneja

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supabase schema contract
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm run verify:supabase-schema

      - name: Run Type Check
        run: pnpm run check

      - name: Run Automated Tests with Coverage
        run: pnpm test -- --coverage --reporter=verbose

      - name: Run Automated Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level high

      - name: Run Production Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: NODE_OPTIONS="--max-old-space-size=4096" pnpm build

      - name: Notify Slack on Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data '{"text": "✅ *Smart Manager ERP* build, test coverage, and audit passed successfully on commit `${{ github.sha }}` by `${{ github.actor }}`."}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data '{"text": "❌ *Smart Manager ERP* pipeline FAILED on commit `${{ github.sha }}`. Please inspect GitHub Actions."}' \
            "$SLACK_WEBHOOK_URL"

  browser-signup:
    name: Browser Dashboard Preference Journey
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.2
          run_install: false

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-browser-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-browser-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated dashboard preference journey
        run: |
          pnpm run pretest:browser
          node scripts/serve-build-for-e2e.mjs > isolated-browser-server.log 2>&1 &
          E2E_STATIC_SERVER_PID=$!
          trap 'kill "$E2E_STATIC_SERVER_PID"' EXIT
          sleep 1
          PLAYWRIGHT_EXTERNAL_SERVER=1 pnpm exec playwright test browser-tests/signupWizard.spec.ts --config=playwright.isolated.config.ts

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signup-browser-diagnostics
          path: |
            test-results/
            playwright-report/
            isolated-browser-server.log
          if-no-files-found: ignore
