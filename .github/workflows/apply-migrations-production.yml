name: Apply production database migrations

on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: 'Approved change ticket or release reference'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply-migrations:
    name: Apply approved production migration
    runs-on: ubuntu-latest
    # Configure required reviewers on the GitHub "production" environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply approved migrations
        run: pnpm exec tsx server/runMigrations.mjs --apply
        env:
          APPLY_MIGRATIONS: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
