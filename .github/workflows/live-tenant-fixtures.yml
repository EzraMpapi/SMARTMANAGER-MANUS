name: Live authenticated tenant fixtures



on:

  workflow_dispatch:
  
    inputs:
    
      fixture_key:
      
        description: "Optional stable fixture key; leave blank to use the GitHub run ID"
        
        required: false
        
        type: string
        
      email_domain:
      
        description: "Controlled test email domain configured in Supabase Auth"
        
        required: false
        
        default: "example.invalid"
        
        type: string
        


permissions:

  contents: read
  


concurrency:

  group: live-e2e-${{ inputs.fixture_key || github.run_id }}
  
  cancel-in-progress: false
  


jobs:

  authenticated-tenant-workflow:
  
    if: github.ref == 'refs/heads/main'
    
    name: Provision, test, and clean isolated tenant
    
    runs-on: ubuntu-latest
    
    environment: live-e2e
    
    timeout-minutes: 20
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        


      - name: Set up pnpm
      
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        
        with:
        
          version: 10.34.2
          
          run_install: false
          


      - name: Set up Node.js
      
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        
        with:
        
          node-version: 22.13.0
          
          cache: pnpm
          


      - name: Install dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Validate protected fixture inputs
        id: preflight
        env:
          FIXTURE_TARGET: isolated
          FIXTURE_CONFIRM: CREATE_SMARTMANAGER_E2E_FIXTURE
          FIXTURE_EMAIL_DOMAIN: ${{ inputs.email_domain }}
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          LIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LIVE_SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LIVE_SUPABASE_PUBLISHABLE_KEY }}
          LIVE_FIXTURE_PASSWORD: ${{ secrets.LIVE_FIXTURE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          preflight_error() {
            printf "failed=true\n" >> "$GITHUB_OUTPUT"
            printf "message=%s\n" "$1" >> "$GITHUB_OUTPUT"
            echo "::error title=live-e2e preflight::$1" >&2
            exit 1
          }

          if [[ "${FIXTURE_TARGET:-}" != "isolated" ]]; then
            preflight_error "Fixture target must be isolated; refusing to run against a shared or production tenant."
          fi

          if [[ "${FIXTURE_CONFIRM:-}" != "CREATE_SMARTMANAGER_E2E_FIXTURE" ]]; then
            preflight_error "Fixture confirmation is missing or invalid; use the workflow's protected confirmation value."
          fi

          if [[ -z "${FIXTURE_EMAIL_DOMAIN:-}" ]]; then
            preflight_error "Missing workflow input email_domain; provide the controlled Supabase Auth test email domain."
          fi

          if [[ ! "${FIXTURE_EMAIL_DOMAIN}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            preflight_error "Workflow input email_domain contains invalid characters; use a hostname such as example.invalid."
          fi

          if [[ -z "${LIVE_SUPABASE_URL:-}" ]]; then
            preflight_error "Missing environment variable LIVE_SUPABASE_URL; add it under Settings > Environments > live-e2e > Variables."
          fi

          if [[ ! "${LIVE_SUPABASE_URL}" =~ ^https://[^[:space:]]+$ ]]; then
            preflight_error "LIVE_SUPABASE_URL must be a non-empty HTTPS URL; its value is intentionally not printed."
          fi

          if [[ -z "${LIVE_SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            preflight_error "Missing environment secret LIVE_SUPABASE_SERVICE_ROLE_KEY; add it under Settings > Environments > live-e2e > Secrets."
          fi

          if [[ -z "${LIVE_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            preflight_error "Missing environment secret LIVE_SUPABASE_PUBLISHABLE_KEY; add it under Settings > Environments > live-e2e > Secrets."
          fi

          if [[ -z "${LIVE_FIXTURE_PASSWORD:-}" ]]; then
            preflight_error "Missing environment secret LIVE_FIXTURE_PASSWORD; add it under Settings > Environments > live-e2e > Secrets."
          fi

          if [[ "${#LIVE_FIXTURE_PASSWORD}" -lt 12 ]]; then
            preflight_error "LIVE_FIXTURE_PASSWORD must contain at least 12 characters; its value is intentionally not printed."
          fi

          echo "live-e2e protected input preflight passed; secret values were not printed."

      - name: Notify Slack about preflight failure
        if: ${{ failure() && steps.preflight.outcome == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.LIVE_E2E_SLACK_WEBHOOK_URL }}
          PREFLIGHT_MESSAGE: ${{ steps.preflight.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning title=live-e2e notification::Preflight failed, but LIVE_E2E_SLACK_WEBHOOK_URL is not configured; no Slack notification was sent."
            exit 0
          fi

          text="live-e2e preflight failed: ${PREFLIGHT_MESSAGE:-No diagnostic message was recorded.} Run: ${RUN_URL}"
          payload="$(jq -n --arg text "$text" '{text: $text}')"
          if ! curl --fail --silent --show-error --max-time 15 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" >/dev/null; then
            echo "::warning title=live-e2e notification::Slack notification delivery failed; the original preflight failure remains unchanged."
          fi

      - name: Verify runtime secret injection readiness
      
        env:
        
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          
          LIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LIVE_SUPABASE_SERVICE_ROLE_KEY }}
          
          LIVE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LIVE_SUPABASE_PUBLISHABLE_KEY }}
          
          LIVE_FIXTURE_PASSWORD: ${{ secrets.LIVE_FIXTURE_PASSWORD }}
          
          LIVE_FIXTURE_TARGET: isolated
          
          LIVE_FIXTURE_CONFIRM: CREATE_SMARTMANAGER_E2E_FIXTURE
          
        run: node scripts/verifyGithubEnvironment.mjs --runtime
        


      - name: Run isolated authenticated tenant workflow
      
        env:
        
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          
          LIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LIVE_SUPABASE_SERVICE_ROLE_KEY }}
          
          LIVE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LIVE_SUPABASE_PUBLISHABLE_KEY }}
          
          LIVE_FIXTURE_PASSWORD: ${{ secrets.LIVE_FIXTURE_PASSWORD }}
          
          LIVE_FIXTURE_TARGET: isolated
          
          LIVE_FIXTURE_CONFIRM: CREATE_SMARTMANAGER_E2E_FIXTURE
          
          LIVE_FIXTURE_KEY: ${{ inputs.fixture_key || format('gha-{0}', github.run_id) }}
          
          LIVE_FIXTURE_EMAIL_DOMAIN: ${{ inputs.email_domain }}
          
          LIVE_FIXTURE_MANIFEST: ${{ runner.temp }}/smartmanager-e2e-fixture.json
          
        run: node scripts/runLiveTenantWorkflow.mjs
        


      - name: Ensure fixture cleanup after cancellation or runner interruption
      
        if: always()
        
        env:
        
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          
          LIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LIVE_SUPABASE_SERVICE_ROLE_KEY }}
          
          LIVE_FIXTURE_TARGET: isolated
          
          LIVE_FIXTURE_MANIFEST: ${{ runner.temp }}/smartmanager-e2e-fixture.json
          
        run: |
        
          set -euo pipefail
          
          if [ -f "$LIVE_FIXTURE_MANIFEST" ]; then
          
            node scripts/liveTenantFixtures.mjs cleanup
            
          fi
          





















































































