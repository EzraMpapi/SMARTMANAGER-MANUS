<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101828" />
    <title>Smart Manager — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101828; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #243b67 0, #101828 48%, #0b1220 100%); }
      main { width: min(100%, 560px); border: 1px solid rgba(148, 163, 184, .22); border-radius: 28px; padding: clamp(28px, 6vw, 52px); background: rgba(15, 23, 42, .78); box-shadow: 0 24px 80px rgba(2, 6, 23, .42); text-align: center; }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 20px; background: linear-gradient(145deg, #38bdf8, #2563eb); color: white; font-size: 28px; font-weight: 800; letter-spacing: -.08em; box-shadow: 0 12px 28px rgba(37, 99, 235, .35); }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 42px); letter-spacing: -.04em; }
      p { margin: 16px auto 0; max-width: 420px; color: #cbd5e1; line-height: 1.65; }
      .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 8px 12px; border: 1px solid rgba(251, 191, 36, .28); border-radius: 999px; background: rgba(120, 53, 15, .25); color: #fde68a; font-size: 13px; font-weight: 700; }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: #fbbf24; box-shadow: 0 0 0 4px rgba(251, 191, 36, .14); }
      button { margin-top: 32px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: #38bdf8; color: #082f49; font: inherit; font-weight: 800; cursor: pointer; transition: transform 160ms ease-out, background 160ms ease-out; }
      button:hover { background: #7dd3fc; } button:active { transform: scale(.97); } button:focus-visible { outline: 3px solid #f8fafc; outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: #94a3b8; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title" data-testid="offline-fallback">
      <div class="mark" aria-hidden="true">SM</div>
      <h1 id="offline-title">You’re offline</h1>
      <p>Smart Manager could not reach the network. Your server data is safe. Reconnect to continue, then try again when your connection is available.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>Waiting for connection</div>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>Changes are only confirmed after the server acknowledges them.</small>
    </main>
    <script>
      window.addEventListener("online", function () { window.location.reload(); });
    </script>
  </body>
</html>
